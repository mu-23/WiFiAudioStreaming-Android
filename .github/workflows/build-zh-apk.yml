name: Build Chinese APK

on:
  workflow_dispatch:
  push:
    branches: [ "zh-v1.2" ]
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - ".github/workflows/build-zh-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore signing cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wfas-zh-v1-debug-keystore

      - name: Build installable APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk WiFi-Audio-Streaming-v1.2.1-zh-CN.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Audio-Streaming-v1.2.1-zh-CN
          path: WiFi-Audio-Streaming-v1.2.1-zh-CN.apk
          if-no-files-found: error

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view zh-v1.2.1 >/dev/null 2>&1; then
            gh release upload zh-v1.2.1 WiFi-Audio-Streaming-v1.2.1-zh-CN.apk --clobber
          else
            gh release create zh-v1.2.1 WiFi-Audio-Streaming-v1.2.1-zh-CN.apk \
              --title "WiFi Audio Streaming v1.2.1 简体中文版" \
              --notes "Unofficial Simplified Chinese localization based on upstream v1.2.1 source."
          fi
