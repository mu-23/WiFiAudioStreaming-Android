name: Build Audio Bridge Lab

on:
  workflow_dispatch:
  push:
    branches: [ "audio-bridge-lab" ]
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - ".github/workflows/build-zh-apk.yml"
      - "docs/AUDIO_BRIDGE_LAB.md"

permissions:
  contents: read

concurrency:
  group: audio-bridge-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Restore stable lab signing key
        uses: actions/cache@v4
        with:
          path: .ci/lab-debug.keystore
          key: wfas-audio-bridge-lab-debug-keystore-v2

      - name: Ensure stable lab signing key
        run: |
          set -euo pipefail
          mkdir -p .ci
          if [ ! -f .ci/lab-debug.keystore ]; then
            keytool -genkeypair               -keystore .ci/lab-debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=WFAS Audio Bridge Lab,O=WFAS,C=US"               -keyalg RSA               -keysize 2048               -validity 10000
          fi
          echo "WFAS_LAB_KEYSTORE=$GITHUB_WORKSPACE/.ci/lab-debug.keystore" >> "$GITHUB_ENV"


      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set lab CI version
        run: |
          set -euo pipefail
          CODE=$((2201000 + GITHUB_RUN_NUMBER))
          echo "WFAS_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "WFAS_VERSION_NAME=1.2.1-audio-bridge-lab.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build lab debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare versioned artifact
        run: |
          set -euo pipefail
          APK_NAME="WiFi-Audio-Bridge-Lab-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "LAB_APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "Prepared $APK_NAME with version $WFAS_VERSION_NAME ($WFAS_VERSION_CODE)"

      - name: Upload versioned lab APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Audio-Bridge-Lab-${{ github.run_number }}
          path: ${{ env.LAB_APK_NAME }}
          if-no-files-found: error
