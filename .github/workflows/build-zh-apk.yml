name: Build Chinese APK

on:
  workflow_dispatch:
  push:
    branches: [ "zh-v1.2" ]
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - ".github/workflows/build-zh-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      EXPECTED_SIGNING_CERT_SHA256: 4ddf267d25a73f0a28446c9e77293204e32f6777c63417feb7bd925040fefb63
      EXPECTED_KEYSTORE_SHA256: b9547d9d0618baf959842882e376425bded7ebe990d5418c0a8c650e59aa8db2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate signing secrets
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/wfas-release.jks"
          test -s "$RUNNER_TEMP/wfas-release.jks"

      - name: Validate restored signing key
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ACTUAL_KEYSTORE_SHA256=$(sha256sum "$RUNNER_TEMP/wfas-release.jks" | awk '{print tolower($1)}')
          if [ "$ACTUAL_KEYSTORE_SHA256" != "$EXPECTED_KEYSTORE_SHA256" ]; then
            echo "::error::SIGNING_KEY_BASE64 does not match the permanent signing keystore."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/wfas-release.jks" -storepass "$SIGNING_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::SIGNING_STORE_PASSWORD does not unlock the permanent signing keystore."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/wfas-release.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::SIGNING_KEY_ALIAS is not present in the permanent signing keystore."
            exit 1
          fi
          echo "Permanent signing keystore, store password, and alias validated."

      - name: Set CI version
        run: |
          set -euo pipefail
          CODE=$((1201000 + GITHUB_RUN_NUMBER))
          echo "WFAS_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "WFAS_VERSION_NAME=1.2.1-cn.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build unsigned release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Sign release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          INPUT="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="WiFi-Audio-Streaming-v1.2.1-zh-CN.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/wfas-release.jks" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$OUTPUT" \
            "$INPUT"

      - name: Verify APK signer
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="WiFi-Audio-Streaming-v1.2.1-zh-CN.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')
          test -n "$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_SIGNING_CERT_SHA256" ]; then
            echo "Unexpected signing certificate: $ACTUAL"
            exit 1
          fi
          echo "Verified permanent signer: $ACTUAL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Audio-Streaming-v1.2.1-zh-CN
          path: WiFi-Audio-Streaming-v1.2.1-zh-CN.apk
          if-no-files-found: error

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view zh-v1.2.1 >/dev/null 2>&1; then
            gh release upload zh-v1.2.1 WiFi-Audio-Streaming-v1.2.1-zh-CN.apk --clobber
          else
            gh release create zh-v1.2.1 WiFi-Audio-Streaming-v1.2.1-zh-CN.apk \
              --title "WiFi Audio Streaming v1.2.1 简体中文版" \
              --notes "Unofficial Simplified Chinese localization based on upstream v1.2.1 source. Permanently signed Chinese build."
          fi
