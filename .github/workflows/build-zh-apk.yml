name: Build Audio Bridge Lab

on:
  workflow_dispatch:
  push:
    branches: [ "audio-bridge-lab" ]
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - ".github/workflows/build-zh-apk.yml"
      - "docs/AUDIO_BRIDGE_LAB.md"

permissions:
  contents: read

concurrency:
  group: audio-bridge-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set lab CI version
        run: |
          set -euo pipefail
          CODE=$((2201000 + GITHUB_RUN_NUMBER))
          echo "WFAS_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "WFAS_VERSION_NAME=1.2.1-audio-bridge-lab.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build lab debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk WiFi-Audio-Bridge-Lab.apk

      - name: Upload lab APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Audio-Bridge-Lab
          path: WiFi-Audio-Bridge-Lab.apk
          if-no-files-found: error
